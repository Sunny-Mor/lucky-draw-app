apiVersion: v1
kind: Namespace
metadata:
  name: luckydraw

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: luckydraw-quota
  namespace: luckydraw
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: luckydraw-limits
  namespace: luckydraw
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
