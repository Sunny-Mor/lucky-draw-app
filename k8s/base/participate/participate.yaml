apiVersion: apps/v1
kind: Deployment
metadata:
  name: participate
  namespace: luckydraw
  labels:
    app: participate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: participate
  template:
    metadata:
      labels:
        app: participate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: participate
          image: PARTICIPATE_IMAGE   # replaced by deploy workflow
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: redis-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: participate
  namespace: luckydraw
spec:
  type: ClusterIP
  selector:
    app: participate
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: participate
  namespace: luckydraw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: participate
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
