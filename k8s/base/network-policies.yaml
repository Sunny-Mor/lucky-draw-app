# Deny all by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: luckydraw
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow all pods within the namespace to talk to each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: luckydraw
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: luckydraw
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow ALB health checks and traffic to app pods (ALB uses node IP, not pod selector)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-ingress
  namespace: luckydraw
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [participate, submissions, pick-winner]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000

---
# Allow ECR and AWS API egress for image pulls (node-level, but needed for pod init)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-internet
  namespace: luckydraw
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
