apiVersion: apps/v1
kind: Deployment
metadata:
  name: pick-winner
  namespace: luckydraw
  labels:
    app: pick-winner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pick-winner
  template:
    metadata:
      labels:
        app: pick-winner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: pick-winner
          image: PICK_WINNER_IMAGE   # replaced by deploy workflow
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ADMIN_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: pick-winner
  namespace: luckydraw
spec:
  type: ClusterIP
  selector:
    app: pick-winner
  ports:
    - name: http
      port: 80
      targetPort: http
