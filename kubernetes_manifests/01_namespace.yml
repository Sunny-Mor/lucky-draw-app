# Create a namespace and set resource quotas and limit ranges

kind: Namespace
apiVersion: v1
metadata:
  name: sunnymor

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: sunnymor
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 4Gi
    pods: "10"
    services: "5"

---

apiVersion: v1
kind: LimitRange
metadata:
  name: limit-range
  namespace: sunnymor
spec:
  limits:
    - default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
