# kube-prometheus-stack Helm values
# Deploy with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values monitoring/kube-prometheus-stack-values.yaml \
#     --version 58.0.0

grafana:
  enabled: true
  adminPassword: "changeme"   # override via --set grafana.adminPassword=$SECRET in CI

  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi

  service:
    type: ClusterIP   # access via port-forward; expose via ALB in a later phase

  # Useful default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

    # Scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

# Disable components not needed in phase 1
kubeEtcd:
  enabled: false   # not accessible on EKS managed control plane

kubeControllerManager:
  enabled: false   # not accessible on EKS managed control plane

kubeScheduler:
  enabled: false   # not accessible on EKS managed control plane
