name: Application Deploy

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "docker/**"
      - "k8s/**"
  workflow_dispatch:

env:
  AWS_REGION:   us-east-1
  CLUSTER_NAME: luckydraw-prod
  K8S_NAMESPACE: luckydraw
  # Secret name matches what Terraform creates: <cluster_name>/app-secrets
  SECRETS_NAME: luckydraw-prod/app-secrets

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------
  # Build & push all 4 images in parallel
  # -------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: participate
            dockerfile: docker/participate/Dockerfile
          - service: submissions
            dockerfile: docker/submissions/Dockerfile
          - service: pick-winner
            dockerfile: docker/pick-winner/Dockerfile
          - service: sync-worker
            dockerfile: docker/sync-worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repo URL
        id: ecr-url
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "url=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/luckydraw-prod/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-url.outputs.url }}:${{ github.sha }}
            ${{ steps.ecr-url.outputs.url }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Deploy to EKS
  # -------------------------------------------------------
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # Pull all secrets from AWS Secrets Manager (created by Terraform)
      # No manual secret values needed in GitHub — Terraform generates them.
      - name: Pull secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${{ env.SECRETS_NAME }}" \
            --query SecretString --output text)

          echo "POSTGRES_PASSWORD=$(echo $SECRET | jq -r .POSTGRES_PASSWORD)" >> "$GITHUB_OUTPUT"
          echo "ADMIN_USERNAME=$(echo $SECRET | jq -r .ADMIN_USERNAME)"       >> "$GITHUB_OUTPUT"
          echo "ADMIN_PASSWORD=$(echo $SECRET | jq -r .ADMIN_PASSWORD)"       >> "$GITHUB_OUTPUT"
          echo "APP_SECRET_KEY=$(echo $SECRET | jq -r .APP_SECRET_KEY)"       >> "$GITHUB_OUTPUT"

      - name: Ensure namespace exists
        run: kubectl apply -f k8s/base/namespace.yaml

      - name: Create / update Kubernetes secrets
        run: |
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_PASSWORD="${{ steps.secrets.outputs.POSTGRES_PASSWORD }}" \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secret \
            --from-literal=ADMIN_USERNAME="${{ steps.secrets.outputs.ADMIN_USERNAME }}" \
            --from-literal=ADMIN_PASSWORD="${{ steps.secrets.outputs.ADMIN_PASSWORD }}" \
            --from-literal=SECRET_KEY="${{ steps.secrets.outputs.APP_SECRET_KEY }}" \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve ECR base URL
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "base=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/luckydraw-prod" >> "$GITHUB_OUTPUT"

      - name: Set image tags in manifests
        run: |
          TAG=${{ github.sha }}
          BASE=${{ steps.ecr.outputs.base }}
          sed -i "s|PARTICIPATE_IMAGE|${BASE}/participate:${TAG}|g"  k8s/base/participate/participate.yaml
          sed -i "s|SUBMISSIONS_IMAGE|${BASE}/submissions:${TAG}|g"  k8s/base/submissions/submissions.yaml
          sed -i "s|PICK_WINNER_IMAGE|${BASE}/pick-winner:${TAG}|g"  k8s/base/pick-winner/pick-winner.yaml
          sed -i "s|SYNC_WORKER_IMAGE|${BASE}/sync-worker:${TAG}|g"  k8s/base/sync-worker/sync-worker.yaml

      - name: Deploy with Kustomize
        run: kubectl apply -k k8s/

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/participate -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/submissions -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/pick-winner -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/sync-worker -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Print ALB address
        run: |
          echo "==> ALB Ingress address:"
          kubectl get ingress luckydraw-ingress -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
