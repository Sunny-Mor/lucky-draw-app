name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

env:
  TF_DIR: terraform/environments/prod
  AWS_REGION: us-east-1
  CLUSTER_NAME: luckydraw-prod

permissions:
  contents: read
  id-token: write   # required for OIDC auth

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    outputs:
      alb_role_arn: ${{ steps.outputs.outputs.alb_role_arn }}
      apply_ran:    ${{ steps.apply.outputs.ran }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false   # needed to capture outputs cleanly

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        id: apply
        if: github.event.inputs.action == 'apply' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          terraform apply -auto-approve tfplan
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Capture Terraform outputs
        id: outputs
        if: steps.apply.outputs.ran == 'true'
        run: |
          echo "alb_role_arn=$(terraform output -raw alb_controller_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false

  # -------------------------------------------------------
  # Install AWS Load Balancer Controller via Helm
  # Runs only after a successful terraform apply.
  # ALB controller is NOT an EKS managed addon — it is a
  # third-party Helm chart that requires an IRSA role.
  # Terraform creates the IRSA role; this job installs the chart.
  # -------------------------------------------------------
  install-alb-controller:
    name: Install ALB Controller
    runs-on: ubuntu-latest
    needs: terraform
    if: needs.terraform.outputs.apply_ran == 'true'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Add eks-charts Helm repo
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      - name: Install / upgrade ALB Controller
        run: |
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${{ needs.terraform.outputs.alb_role_arn }}" \
            --wait \
            --timeout 5m

      - name: Verify ALB Controller
        run: kubectl get deployment aws-load-balancer-controller -n kube-system
